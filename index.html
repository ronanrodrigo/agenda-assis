<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Google Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f3f4;
      display: flex;
      flex-direction: column;
    }

    .calendar-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100vw;
      overflow: hidden;
    }

    .calendar-columns {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .calendar-iframe-wrapper {
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .calendar-current {
      width: 50%;
    }

    .calendar-next {
      width: 50%;
    }

    .calendar-iframe-wrapper iframe {
      display: block;
      width: 90.91%;
      height: 90.91%;
      border: none;
      transform: scale(1.1);
      transform-origin: top left;
    }

    .qr-hero {
      background: linear-gradient(135deg, #c62828, #b71c1c);
      padding: 20px 32px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .qr-hero-star {
      font-size: 32px;
      color: #FFD700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .qr-hero-img-wrapper {
      background: white;
      padding: 8px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-hero img {
      width: 82px;
      height: 82px;
      display: block;
    }

    .qr-hero-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .qr-hero-text h2 {
      font-size: 26px;
      color: white;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .qr-hero-text p {
      font-size: 18px;
      color: rgba(255,255,255,0.85);
      margin: 0;
      line-height: 1.3;
    }

    .open-calendar-btn {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #4285f4;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      z-index: 1000;
      cursor: pointer;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .calendar-next {
        display: none;
      }

      .calendar-current {
        width: 100%;
      }

      .calendar-iframe-wrapper iframe {
        width: 100%;
        height: 100%;
        transform: none;
      }

      .qr-hero {
        display: none;
      }

      .open-calendar-btn {
        display: block;
      }
    }


  </style>
  <meta http-equiv="refresh" content="300">
</head>
<body>
  <div class="qr-hero">
    <span class="qr-hero-star">★</span>
    <div class="qr-hero-img-wrapper">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://ronanrodrigo.dev/agenda-assis" alt="QR Code - Abrir agenda no celular">
    </div>
    <div class="qr-hero-text">
      <h2>Acompanhe aqui a agenda da campanha!</h2>
      <p>Escaneie o QR code para abrir no navegador</p>
    </div>
  </div>
  <div class="calendar-container">
    <div class="calendar-columns">
      <div class="calendar-iframe-wrapper calendar-current">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=assis.capim%40gmail.com&ctz=America%2FSao_Paulo&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&mode=AGENDA&hl=pt_BR&showDate=0&bgcolor=%23ffffff&color=%23c62828"
          scrolling="no"
        ></iframe>
      </div>
      <div class="calendar-iframe-wrapper calendar-next">
        <iframe id="nextMonthFrame"
          scrolling="no"
        ></iframe>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var now = new Date();
      var year = now.getFullYear();
      var month = now.getMonth();

      // Primeiro dia do próximo mês
      var nextMonth = month + 1;
      var nextYear = year;
      if (nextMonth > 11) {
        nextMonth = 0;
        nextYear++;
      }
      var startDate = new Date(nextYear, nextMonth, 1);

      // Último dia do próximo mês
      var endDate = new Date(nextYear, nextMonth + 1, 0);

      function fmt(d) {
        return d.getFullYear().toString() +
          String(d.getMonth() + 1).padStart(2, '0') +
          String(d.getDate()).padStart(2, '0');
      }

      var datesParam = fmt(startDate) + '/' + fmt(endDate);

      var url = 'https://calendar.google.com/calendar/embed' +
        '?src=assis.capim%40gmail.com' +
        '&ctz=America%2FSao_Paulo' +
        '&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0' +
        '&mode=AGENDA' +
        '&hl=pt_BR' +
        '&showDate=0&bgcolor=%23ffffff&color=%23c62828' +
        '&dates=' + datesParam;

      document.getElementById('nextMonthFrame').src = url;
    })();
  </script>
  <a class="open-calendar-btn" href="https://calendar.google.com/calendar/u/0/r/agenda/assis.capim@gmail.com" target="_self">
    📅 Abrir no Google Agenda
  </a>
</body>
</html>
