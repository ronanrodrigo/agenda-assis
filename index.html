<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Google Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #4285f4;
    }

    .calendar-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .calendar-iframe-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .calendar-iframe-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }


  </style>
</head>
<body>
  <div class="calendar-container">
    <div class="calendar-iframe-wrapper">
      <iframe
        src="https://calendar.google.com/calendar/embed?src=assis.capim%40gmail.com&ctz=America%2FSao_Paulo&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0"
        scrolling="no"
      ></iframe>    </div>
  </div>
</body>
</html>
