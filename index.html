<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Google Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #4285f4;
    }

    .calendar-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .calendar-columns {
      display: flex;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .calendar-iframe-wrapper {
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .calendar-current {
      width: 50%;
    }

    .calendar-next {
      width: 50%;
    }

    .calendar-iframe-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      transform: scale(1.1);
      transform-origin: top left;
    }

    .qr-code-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      z-index: 1000;
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }

    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .qr-item img {
      width: 80px;
      height: 80px;
      display: block;
    }

    .qr-item span {
      font-size: 9px;
      color: #555;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }

    .open-calendar-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 1000;
      cursor: pointer;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .calendar-next {
        display: none;
      }

      .calendar-current {
        width: 100%;
      }

      .qr-code-overlay {
        display: none;
      }

      .open-calendar-btn {
        display: block;
      }
    }


  </style>
  <meta http-equiv="refresh" content="300">
</head>
<body>
  <div class="calendar-container">
    <div class="calendar-columns">
      <div class="calendar-iframe-wrapper calendar-current">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=assis.capim%40gmail.com&ctz=America%2FSao_Paulo&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&mode=AGENDA&hl=pt_BR&showDate=0&bgcolor=%23ffffff"
          scrolling="no"
        ></iframe>
      </div>
      <div class="calendar-iframe-wrapper calendar-next">
        <iframe id="nextMonthFrame"
          scrolling="no"
        ></iframe>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var now = new Date();
      var year = now.getFullYear();
      var month = now.getMonth();

      // Primeiro dia do próximo mês
      var nextMonth = month + 1;
      var nextYear = year;
      if (nextMonth > 11) {
        nextMonth = 0;
        nextYear++;
      }
      var startDate = new Date(nextYear, nextMonth, 1);

      // Último dia do próximo mês
      var endDate = new Date(nextYear, nextMonth + 1, 0);

      function fmt(d) {
        return d.getFullYear().toString() +
          String(d.getMonth() + 1).padStart(2, '0') +
          String(d.getDate()).padStart(2, '0');
      }

      var datesParam = fmt(startDate) + '/' + fmt(endDate);

      var url = 'https://calendar.google.com/calendar/embed' +
        '?src=assis.capim%40gmail.com' +
        '&ctz=America%2FSao_Paulo' +
        '&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0' +
        '&mode=AGENDA' +
        '&hl=pt_BR' +
        '&showDate=0&bgcolor=%23ffffff' +
        '&dates=' + datesParam;

      document.getElementById('nextMonthFrame').src = url;
    })();
  </script>
  <a class="open-calendar-btn" href="https://calendar.google.com/calendar/u/0/r/agenda/assis.capim@gmail.com" target="_self">
    📅 Abrir no Google Agenda
  </a>
  <div class="qr-code-overlay">
    <div class="qr-item">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://calendar.google.com/calendar/u/0/r/agenda/assis.capim@gmail.com" alt="QR Code - Google Agenda">
      <span>Google Agenda</span>
    </div>
    <div class="qr-item">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://ronanrodrigo.dev/agenda-assis" alt="QR Code - Versão Web">
      <span>Web</span>
    </div>
  </div>
</body>
</html>
